name: Build And Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.rid }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runner: windows-latest
          - rid: win-x86
            runner: windows-latest
          - rid: osx-arm64
            runner: macos-latest
          - rid: osx-x64
            runner: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish ${{ matrix.rid }}
        shell: pwsh
        run: >
          dotnet publish .\BrainFudger\BrainFudger.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -o "$env:RUNNER_TEMP/publish/${{ matrix.rid }}"

      - name: Package ${{ matrix.rid }}
        shell: pwsh
        run: |
          $assetName = "BrainFudger-${{ matrix.rid }}-${{ github.ref_name }}.zip"
          $publishPath = Join-Path $env:RUNNER_TEMP "publish/${{ matrix.rid }}"
          $assetPath = Join-Path $env:RUNNER_TEMP $assetName
          Compress-Archive -Path (Join-Path $publishPath '*') -DestinationPath $assetPath
          "ASSET_PATH=$assetPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.rid }}
          path: ${{ env.ASSET_PATH }}
          if-no-files-found: error
          compression-level: 0

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: release-*
          merge-multiple: true

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
          fail_on_unmatched_files: true
